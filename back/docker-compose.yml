# MongoDB local pour le développement.
# Démarrage : docker compose up -d

services:
  mongo:
    image: mongo:7
    container_name: pdf-formation-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: hardy
      MONGO_INITDB_ROOT_PASSWORD: 50jKekQ3a1Qp
      MONGO_INITDB_DATABASE: pdf-formation

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: