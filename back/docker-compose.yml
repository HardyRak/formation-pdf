# ============================================================
# PDF Formation — Backend : stack de développement
# MongoDB + seed + API.
#
# Docker Compose lit automatiquement le fichier `.env` situé
# dans ce dossier (voir `.env.example`) pour substituer les
# variables (MONGO_*, JWT_*, PORT…). Le `.env` n'est jamais commité.
#
# Démarrage complet :  docker compose up -d
# Re-seed manuel   :  docker compose up --force-recreate seed
# ============================================================

services:
  mongo:
    image: mongo:7
    container_name: pdf-formation-mongo
    restart: unless-stopped
    ports:
      # Hôte -> conteneur (27017). MONGO_PORT sert aussi au backend
      # lancé depuis la machine hôte (npm run start:dev / npm run seed).
      - "${MONGO_PORT:-27017}:27017"
    environment:
      # Authentification optionnelle : si MONGO_USER / MONGO_PASSWORD sont
      # renseignés, l'auth est activée et le backend doit utiliser les mêmes
      # identifiants (MONGO_AUTH_SOURCE = base d'authentification).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pdf-formation}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$MONGO_INITDB_ROOT_USERNAME" ]; then
            mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping").ok';
          else
            mongosh --quiet --eval 'db.adminCommand("ping").ok';
          fi
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  seed:
    build: .
    image: pdf-formation-backend
    container_name: pdf-formation-seed
    restart: "no"
    command: ["node", "dist/seed/run-seed.js"]
    depends_on:
      mongo:
        condition: service_healthy
    environment: &backend-env
      # Dans le réseau Compose, MongoDB est joignable via le nom du service
      # (cette valeur prime sur MONGO_HOST du .env, réservé au lancement hôte).
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-pdf-formation}
      MONGO_USER: ${MONGO_USER:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}

  api:
    build: .
    image: pdf-formation-backend
    container_name: pdf-formation-api
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "${PORT:-3000}:3000"
    environment: *backend-env

volumes:
  mongo-data:
