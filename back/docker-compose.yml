# ==== PDF Formation — Backend ====
# Orchestration locale : MongoDB + seed (one-shot) + API.
#
# `docker compose` lit automatiquement le fichier `.env` (même dossier) pour
# injecter les variables `MONGO_*`, `JWT_*`, `PORT`… Aucun secret n'est codé en
# dur dans ce fichier : utilisez `.env` (copié depuis `.env.example`).
#
#   docker compose up -d            # seed (une fois) + API
#   docker compose up --force-recreate seed   # re-peuple la base
#   docker compose logs -f api      # logs de l'API

services:
  mongo:
    image: mongo:7
    container_name: pdf-formation-mongo
    restart: unless-stopped
    environment:
      # Auth Mongo activée UNIQUEMENT si MONGO_USER/MONGO_PASSWORD sont
      # renseignés dans `.env`. Vides (défaut) → base locale sans auth.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pdf-formation}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/seed/run-seed.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-pdf-formation}
      MONGO_USER: ${MONGO_USER:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-pdf-formation}
      MONGO_USER: ${MONGO_USER:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:19006}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_BUFFER_SIZE: ${LOG_BUFFER_SIZE:-1000}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - pdf-uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  pdf-uploads:
